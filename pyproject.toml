[project]
name = "gps-aiedu"
version = "1.0.0"
description = "GPS-Agent evaluation and EMNLP paper artifact for Vietnamese mathematics tutoring dialogue."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "reports", "paper", "webchat/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
